<section class="pagina">
  <a routerLink="/os" class="voltar">← Voltar para a lista</a>
  <h1>Nova ordem de serviço</h1>

  <form [formGroup]="form" (ngSubmit)="salvar()">
    <fieldset>
      <legend>Cliente e veículo</legend>

      <label>
        Nome
        <input formControlName="nomeCliente" autocomplete="off" />
      </label>

      <div class="duas-colunas">
        <label>
          Telefone
          <input formControlName="telefone" inputmode="tel" autocomplete="off" />
        </label>

        <label>
          Placa
          <input formControlName="placa" class="placa" autocomplete="off" />
        </label>
      </div>
    </fieldset>

    <fieldset formArrayName="itens">
      <legend>Peças e serviços</legend>

      @for (item of itens.controls; track item; let i = $index) {
        <div class="item" [formGroupName]="i">
          <label>
            Tipo
            <select formControlName="tipo">
              <option value="SERVICO">Serviço</option>
              <option value="PECA">Peça</option>
            </select>
          </label>

          <label class="descricao">
            Descrição
            <input formControlName="descricao" autocomplete="off" />
          </label>

          <label>
            Qtd
            <input type="number" formControlName="quantidade" min="1" step="1" />
          </label>

          <label>
            Valor unit. (R$)
            <input type="number" formControlName="valorUnitario" min="0" step="0.01" />
          </label>

          <button
            type="button"
            class="remover"
            (click)="removerItem(i)"
            [disabled]="itens.length === 1"
            aria-label="Remover item"
          >
            ✕
          </button>
        </div>
      }

      <button type="button" class="secundario" (click)="adicionarItem()">+ Adicionar item</button>
    </fieldset>

    <div class="rodape">
      <p class="total">
        Total (prévia): <strong>{{ total() | currency: 'BRL' }}</strong>
      </p>

      @if (erro()) {
        <p class="erro" role="alert">{{ erro() }}</p>
      }

      <button type="submit" class="principal" [disabled]="enviando()">
        @if (enviando()) {
          <span class="spinner"></span> Salvando...
        } @else {
          Salvar OS
        }
      </button>
    </div>
  </form>
</section>
